<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CC VIAJES</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="../assets/icons/icon-512.png">
<link rel="stylesheet" href="../assets/css/clientes.css">
</head>
<body>
<div class="iphone">
  <div class="header"><div class="logo"><img src="../assets/icons/icon-512.png" alt="CC"></div>VIAJES</div>
  <div class="content">
    <div class="tit">¿A dónde<br><span>vamos hoy?</span></div>
    <div style="font-size:12px;color:#8E8E93;margin:-12px 0 14px 4px" id="gpsInfo">📍 Detectando tu ubicación...</div>
    <div class="wrap">
      <div class="pill"><span>●</span><input id="origen" placeholder="¿Dónde te recogemos?"></div>
      <div class="pill"><span>◆</span><input id="destino" placeholder="¿A dónde vas?"></div>
    </div>
  </div>
</div>

<!-- SONIDO 01 -->
<audio id="noti01" src="../assets/sounds/mk64_toad01.wav" preload="auto"></audio>

<script>
// Para conductores - función de alerta
const audioToad = document.getElementById('noti01');

function sonarNuevoViaje(datosViaje = null) {
  audioToad.currentTime = 0;
  audioToad.loop = true;
  audioToad.play().catch(()=>{});
  if (navigator.vibrate) navigator.vibrate([400, 100, 400, 100, 400]);
  
  if (Notification && Notification.permission === "granted") {
    new Notification("🚨 Nuevo Viaje CC", {
      body: datosViaje ? `${datosViaje.origen} → ${datosViaje.destino}` : "Tienes un nuevo viaje!",
      icon: "../assets/icons/icon-512.png"
    });
  }
}

function detenerSonido() {
  audioToad.pause();
  audioToad.currentTime = 0;
  if (navigator.vibrate) navigator.vibrate(0);
}

// Pedir permiso al abrir
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

// Habilitar audio con primer toque (Android lo bloquea si no)
document.addEventListener('click', () => {
  audioToad.play().then(()=>{ audioToad.pause(); }).catch(()=>{});
}, {once: true});
</script>

<script src="./js/app.js" type="module"></script>
</body>
</html>
