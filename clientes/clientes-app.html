<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CC VIAJES</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="../assets/icons/icon-512.png">
<link rel="stylesheet" href="../assets/css/clientes.css">
<style>
  .sugerencia-destino {
    display:none;
    margin: 8px 4px 0 4px;
    background:#F2F2F7;
    border-radius:12px;
    padding:10px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .sugerencia-destino b{color:#000}
  .sugerencia-destino small{color:#8E8E93}
</style>
</head>
<body>
<div class="iphone">
  <div class="header"><div class="logo"><img src="../assets/icons/icon-512.png" alt="CC"></div>VIAJES</div>
  <div class="content">
    <div class="tit">¿A dónde<br><span>vamos hoy?</span></div>
    <div style="font-size:12px;color:#8E8E93;margin:-12px 0 14px 4px" id="gpsInfo">📍 Detectando tu ubicación...</div>
    <div class="wrap">
      <div class="pill"><span>●</span><input id="origen" placeholder="¿Dónde te recogemos?"></div>
      <div class="pill"><span>◆</span><input id="destino" placeholder="¿A dónde vas?"></div>
      <!-- AQUI APARECE EL DESTINO ANTERIOR -->
      <div id="sugDestino" class="sugerencia-destino" onclick="usarSugerido()"></div>
    </div>
  </div>
</div>

<script>
// Lógica para sugerir el destino anterior en DESTINO
const inputDestino = document.getElementById('destino');
const sugDiv = document.getElementById('sugDestino');

function cargarUltimoDestino(){
  // 1. Busca en localStorage lo que guardaste del último viaje
  const ultimo = localStorage.getItem('ultimo_destino') || localStorage.getItem('ultimoDestino');
  
  // Si tu app.js ya guarda en Firebase, también lo puede tomar de ahí
  // Por ahora usa localStorage
  
  if(ultimo && ultimo.trim() !== ""){
    sugDiv.innerHTML = `<small>Último destino:</small><br><b>◆ ${ultimo}</b> <small>• tocar para usar</small>`;
    sugDiv.style.display = 'block';
    // También lo pone como placeholder
    inputDestino.placeholder = ultimo;
    inputDestino.dataset.sugerido = ultimo;
  }
}

function usarSugerido(){
  const val = inputDestino.dataset.sugerido;
  if(val){
    inputDestino.value = val;
    sugDiv.style.display = 'none';
    inputDestino.focus();
  }
}

// Cuando el cliente pide viaje, guarda ese destino como el último
// Esta función la debes llamar en tu app.js cuando hace el pedido
function guardarDestinoActual(){
  const dest = inputDestino.value.trim();
  if(dest) localStorage.setItem('ultimo_destino', dest);
}

// Exponer para que tu app.js la pueda usar
window.guardarDestinoActual = guardarDestinoActual;

cargarUltimoDestino();

// Ocultar sugerencia si ya escribe
inputDestino.addEventListener('input', ()=>{
  if(inputDestino.value.length > 0) sugDiv.style.display = 'none';
  else if(inputDestino.dataset.sugerido) sugDiv.style.display = 'block';
});
</script>

<script src="./js/app.js" type="module"></script>
</body>
</html>
