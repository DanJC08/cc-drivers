<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CC VIAJES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#F2F2F7;display:flex;justify-content:center;min-height:100vh}
.iphone{width:100%;max-width:430px;background:#F2F2F7;min-height:100vh}
.header{background:#0A1931;color:#C5A880;padding:16px 20px;display:flex;align-items:center;gap:12px;font-weight:900;height:64px}
.logo{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0A1931;border:2px solid #C5A880;font-size:13px;font-weight:900}
.content{padding:24px 16px 100px}
.tit{font-size:32px;font-weight:800;line-height:.95;letter-spacing:-1px;margin-bottom:20px;color:#0A1931}.tit span{color:#FF7A00}
.wrap{position:relative;width:100%;margin-bottom:12px}
.pill{background:#fff;width:100%;border-radius:18px;padding:0 12px 0 16px;height:62px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.05)}
.pill input{border:0;outline:0;width:100%;font-size:17px;font-weight:500;background:transparent;color:#0A1931}
.card{background:#fff;border-radius:20px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-top:6px}
.card input{width:100%;border:0;border-bottom:1px solid #F2F2F7;padding:18px 12px;outline:0;font-size:17px}
.btn{width:100%;height:56px;background:#111;color:#fff;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:12px}
#estado{margin-top:12px;padding:14px;border-radius:12px;text-align:center;display:none;font-size:14px;font-weight:600;line-height:1.3}.ok{background:#FFF7D1;color:#5a4500;display:block!important}
</style>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAob6r4aBLeT2tJdmNvd3nb1-YnaKmAIik&libraries=places"></script>
</head>
<body>
<div class="iphone">
  <div class="header"><div class="logo">CC</div>VIAJES</div>
  <div class="content">
    <div class="tit">¿A dónde<br><span>vamos hoy?</span></div>

    <div class="wrap"><div class="pill"><span>●</span><input id="origen" placeholder="¿Dónde te recogemos?" autocomplete="off"></div></div>
    <div class="wrap"><div class="pill"><span>📍</span><input id="destino" placeholder="¿A dónde vas?" autocomplete="off"></div></div>

    <div class="wrap">
      <div class="pill">
        <input type="text" id="fechaHora" placeholder="¿A qué hora?"
          onclick="if(this.type==='text'){this.type='datetime-local'; setTimeout(()=>this.showPicker&&this.showPicker(),100)}"
          onfocus="if(this.type==='text'){this.type='datetime-local'; setTimeout(()=>this.showPicker&&this.showPicker(),100)}"
          onblur="if(!this.value) this.type='text'">
      </div>
    </div>

    <div class="card">
      <input id="nombre" placeholder="Tu nombre">
      <input id="telefono" placeholder="Tu celular" inputmode="numeric">
      <button id="btn" class="btn">Solicitar Viaje</button>
      <div id="estado"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"}));

const origenInput = document.getElementById('origen');
const destinoInput = document.getElementById('destino');
let origenCoords = null, destinoCoords = null;

const acOrigen = new google.maps.places.Autocomplete(origenInput,{componentRestrictions:{country:"mx"},fields:["formatted_address","geometry"]});
const acDestino = new google.maps.places.Autocomplete(destinoInput,{componentRestrictions:{country:"mx"},fields:["formatted_address","geometry"]});

acOrigen.addListener("place_changed",()=>{const p=acOrigen.getPlace(); if(p.geometry){origenCoords={lat:p.geometry.location.lat(),lng:p.geometry.location.lng()}; origenInput.value=p.formatted_address;}});
acDestino.addListener("place_changed",()=>{const p=acDestino.getPlace(); if(p.geometry){destinoCoords={lat:p.geometry.location.lat(),lng:p.geometry.location.lng()}; destinoInput.value=p.formatted_address;}});

function getDistanciaReal(o,d){
  return new Promise((res,rej)=>{
    new google.maps.DistanceMatrixService().getDistanceMatrix({
      origins:[new google.maps.LatLng(o.lat,o.lng)], destinations:[new google.maps.LatLng(d.lat,d.lng)], travelMode:'DRIVING', unitSystem: google.maps.UnitSystem.METRIC
    },(r,s)=>{ if(s==='OK' && r.rows[0].elements[0].status==='OK'){ res(r.rows[0].elements[0].distance.value/1000); } else rej(s); });
  });
}
function geocodeDir(dir){
  return new Promise((res,rej)=>{
    new google.maps.Geocoder().geocode({address:dir},(r,s)=>{ if(s==='OK'&&r[0]) res({lat:r[0].geometry.location.lat(),lng:r[0].geometry.location.lng()}); else rej(s); });
  });
}

const btn=document.getElementById('btn'), estado=document.getElementById('estado');
btn.onclick=async()=>{
  const n=document.getElementById('nombre').value||'Cliente';
  const tel=document.getElementById('telefono').value.trim();
  const o=origenInput.value.trim(), d=destinoInput.value.trim();
  const fh=document.getElementById('fechaHora').value;
  if(!o||!d){estado.innerHTML='⚠️ Pon origen y destino';estado.className='ok';estado.style.display='block';return;}

  btn.disabled=true; btn.textContent='Calculando...';
  try{
    if(!origenCoords) origenCoords = await geocodeDir(o);
    if(!destinoCoords) destinoCoords = await geocodeDir(d);
    const dist = await getDistanciaReal(origenCoords,destinoCoords);

    await addDoc(collection(db,"servicios_prueba"),{
      cliente:n, telefono:tel, origen:o, destino:d,
      origenLat:origenCoords.lat, origenLng:origenCoords.lng,
      destinoLat:destinoCoords.lat, destinoLng:destinoCoords.lng,
      distanciaOrigenDestino:dist, distanciaTotal:dist,
      comision: Math.round(dist*1),
      fechaHoraProgramada: fh? new Date(fh).toISOString(): null,
      esProgramado: fh? true:false,
      estado: fh? 'programado':'pendiente',
      creado:serverTimestamp(), creadoEn: new Date().toISOString()
    });
    estado.innerHTML=`✅ Enviado - ${dist.toFixed(2)} km<br><span style="font-weight:400;font-size:13px">Recibirás WhatsApp cuando se acepte.</span>`;
    estado.className='ok'; estado.style.display='block'; btn.textContent='¡Enviado!';
    setTimeout(()=>{btn.disabled=false;btn.textContent='Solicitar Viaje';},3000);
  }catch(e){ alert("Error: "+e); btn.disabled=false; btn.textContent='Solicitar Viaje'; console.error(e); }
};
</script>
</body>
</html>
