<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CC DRIVERS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#F2F2F7;display:flex;justify-content:center;min-height:100vh}
.iphone{width:100%;max-width:430px;background:#F2F2F7;min-height:100vh}
.header{background:#0A1931;color:#C5A880;padding:16px 20px;display:flex;align-items:center;gap:12px;font-weight:900;height:64px}
.logo{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0A1931;border:2px solid #C5A880;font-size:13px;font-weight:900}
.content{padding:24px 16px 100px}
.tit{font-size:32px;font-weight:800;line-height:.95;letter-spacing:-1px;margin-bottom:20px;color:#0A1931}.tit span{color:#FF7A00}
.wrap{position:relative;width:100%;margin-bottom:12px}
.pill{background:#fff;width:100%;border-radius:18px;padding:0 12px 0 16px;height:62px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.05)}
.pill input{border:0;outline:0;width:100%;font-size:17px;font-weight:500;background:transparent;color:#0A1931}
.btnGPS{border:0;background:#0A1931;color:#C5A880;width:38px;height:38px;border-radius:50%;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btnGPS:active{transform:scale(.9)}
.suggest{position:absolute;top:66px;left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:50;max-height:260px;overflow:auto;display:none}
.suggest div{padding:14px 16px;border-bottom:1px solid #F2F2F7;font-size:15px;line-height:1.3}.suggest div:active{background:#F2F2F7}
.card{background:#fff;border-radius:20px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-top:6px}
.card input{width:100%;border:0;border-bottom:1px solid #F2F2F7;padding:18px 12px;outline:0;font-size:17px}
.btn{width:100%;height:56px;background:#111;color:#fff;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:12px}
#estado{margin-top:12px;padding:14px;border-radius:12px;text-align:center;display:none;font-size:14px;font-weight:600;line-height:1.3}.ok{background:#FFF7D1;color:#5a4500;display:block!important}
</style>
</head>
<body>
<div class="iphone">
  <div class="header"><div class="logo">CC</div> CC DRIVERS</div>
  <div class="content">
    <div class="tit">¿A dónde<br><span>vamos hoy?</span></div>
    
    <div class="wrap">
      <div class="pill">
        <span>●</span>
        <input id="origen" placeholder="¿Dónde te recogemos?" autocomplete="off">
        <button id="btnGPS" class="btnGPS">⌖</button>
      </div>
      <div id="sugO" class="suggest"></div>
    </div>

    <div class="wrap">
      <div class="pill"><span>📍</span><input id="destino" placeholder="¿A dónde vas? Ej: Andares" autocomplete="off"></div>
      <div id="sugD" class="suggest"></div>
    </div>

    <div class="card">
      <input id="nombre" placeholder="Tu nombre" value="Daniel">
      <input id="telefono" placeholder="WhatsApp" value="33191736" inputmode="numeric">
      <button id="btn" class="btn">Solicitar Viaje</button>
      <div id="estado"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"}));

async function buscar(q){
  if(q.length < 3) return [];
  const viewbox = "-103.60,20.90,-103.10,20.40";
  let query = q;
  if(!q.toLowerCase().includes("guadalajara")) query = q + ", Guadalajara, Jalisco";
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=mx&viewbox=${viewbox}&bounded=1&addressdetails=1&q=${encodeURIComponent(query)}`;
  const r = await fetch(url);
  let res = await r.json();
  res = res.filter(p => (p.address.state||"").toLowerCase().includes("jalisco"));
  return res;
}
function setup(input, sugBox){
  let t;
  input.addEventListener('input', ()=>{
    clearTimeout(t);
    t=setTimeout(async()=>{
      const res=await buscar(input.value);
      if(!res.length){sugBox.style.display='none';return;}
      sugBox.innerHTML=res.map(p=>`<div data-v="${p.display_name}">${p.display_name}</div>`).join('');
      sugBox.style.display='block';
      sugBox.querySelectorAll('div').forEach(d=>d.onclick=()=>{input.value=d.dataset.v; sugBox.style.display='none';});
    },400);
  });
  document.addEventListener('click',(e)=>{ if(!e.target.closest('.wrap')) sugBox.style.display='none'; });
}
setup(origen, sugO); setup(destino, sugD);

async function usarMiUbicacion(){
  const btn = document.getElementById('btnGPS');
  const inputOrigen = document.getElementById('origen');
  if(!navigator.geolocation){ alert("GPS no disponible"); return; }
  btn.textContent = "…";
  inputOrigen.placeholder = "Buscando tu ubicación...";
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    try{
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1&zoom=18`;
      const r = await fetch(url); const data = await r.json();
      inputOrigen.value = data.display_name;
      btn.textContent = "✓"; setTimeout(()=> btn.textContent = "⌖", 1500);
    } catch(e){ inputOrigen.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`; btn.textContent = "⌖"; }
    inputOrigen.placeholder = "¿Dónde te recogemos?";
  }, () => {
    alert("Activa ubicación y dale Permitir al navegador");
    btn.textContent = "⌖"; inputOrigen.placeholder = "¿Dónde te recogemos?";
  }, { enableHighAccuracy: true, timeout: 10000 });
}
document.getElementById('btnGPS').onclick = usarMiUbicacion;

const btn=document.getElementById('btn'), estado=document.getElementById('estado');
btn.onclick=async()=>{
  const n=nombre.value||'Cliente', tel=telefono.value, o=origen.value.trim(), d=destino.value.trim();
  if(!o||!d){estado.innerHTML='⚠️ Pon origen y destino';estado.className='ok';estado.style.display='block';return;}
  btn.disabled=true; btn.textContent='Enviando...';
  try{
    await addDoc(collection(db,"servicios_prueba"),{cliente:n,telefono:tel,origen:o,destino:d,estado:"pendiente",creado:serverTimestamp()});
    estado.innerHTML='✅ Solicitud enviada<br><span style="font-weight:400;font-size:13px;display:block;margin-top:4px">Recibirás un WhatsApp cuando se acepte tu solicitud.</span>';
    estado.className='ok'; estado.style.display='block'; btn.textContent='¡Enviado!';
    setTimeout(()=>{btn.disabled=false;btn.textContent='Solicitar Viaje';},3000);
  }catch(e){alert(e.message);btn.disabled=false;btn.textContent='Solicitar Viaje';}
};
</script>
</body>
</html>
