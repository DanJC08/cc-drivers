<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Usuarios</title>
<!--<script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY_AQUI&libraries=places&language=es&region=MX"></script-->
<style>
:root{--azul:#0A1931;--naranja:#FF7A00}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#F8FAFC;color:var(--azul);padding-bottom:20px}
.header{background:var(--azul);color:#C5A880;padding:12px 14px;display:flex;gap:10px;font-weight:900;position:sticky;top:0}
.logo{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--azul);border:2px solid #C5A880;font-weight:900}

/* ESTILO EXACTO DE TU IMAGEN */
.search-pill{background:#fff;border-radius:999px;padding:18px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin:12px 14px;cursor:text}
.search-pill .icon{font-size:22px;opacity:.6}
.search-pill input{flex:1;border:0;outline:0;font-size:17px;color:#6B7280;background:transparent}
.search-pill input::placeholder{color:#6B7280}

.form-box{background:#fff;margin:14px;border-radius:20px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.form-box input.normal,.form-box select,.form-box textarea{width:100%;padding:14px;margin:8px 0;border:1px solid #D1D5DB;border-radius:12px;background:#F9FAFB;font-size:14px}
.btn{border:0;border-radius:16px;padding:16px;font-weight:800;color:#fff;width:100%;margin-top:10px;cursor:pointer}
.btn-naranja{background:var(--naranja)}
.label{font-size:12px;font-weight:700;margin-top:8px;display:block;opacity:.8}
.grid2{display:flex;gap:10px} .grid2>*{flex:1}
</style>
</head>
<body>
<div class="header"><div class="logo">CC</div> DRIVERS</div>

<div class="form-box">
  <h3 style="margin:0 0 14px">Solicitar servicio</h3>

  <!-- ORIGEN CON TU ESTILO DE PASTILLA -->
  <label class="label">Origen</label>
  <div class="search-pill" onclick="document.getElementById('origen').focus()">
    <span class="icon">🔍</span>
    <input id="origen" placeholder="¿Dónde te recogemos?">
  </div>

  <!-- DESTINO CON TU ESTILO EXACTO DE LA IMAGEN -->
  <label class="label">Destino</label>
  <div class="search-pill" onclick="document.getElementById('destino').focus()">
    <span class="icon">🔍</span>
    <input id="destino" placeholder="¿A dónde vamos?">
  </div>

  <div class="grid2">
    <div><label class="label">Nombre</label><input class="normal" id="nombre" placeholder="Tu nombre"></div>
    <div><label class="label">Teléfono</label><input class="normal" id="telefono" placeholder="33..."></div>
  </div>

  <label class="label">Tipo de servicio</label>
  <select id="tipo">
    <option value="">Selecciona...</option>
    <option>Viaje Privado</option>
    <option>Encargo</option>
  </select>

  <label class="label">Detalles</label>
  <textarea id="desc" rows="4" placeholder="Describe tu servicio..."></textarea>

  <button class="btn btn-naranja" onclick="enviar()">Solicitar</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "TU_API_KEY_AQUI", authDomain: "cc-drivers.firebaseapp.com", projectId: "cc-drivers" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const $=id=>document.getElementById(id);

function initMaps(){
  const opts={componentRestrictions:{country:"mx"},fields:["formatted_address","name"]};
  new google.maps.places.Autocomplete($("origen"),opts).addListener("place_changed",function(){ $("origen").value=this.getPlace().formatted_address||this.getPlace().name; });
  new google.maps.places.Autocomplete($("destino"),opts).addListener("place_changed",function(){ $("destino").value=this.getPlace().formatted_address||this.getPlace().name; });
}
window.onload=()=>{ initMaps();
  $("nombre").value=localStorage.getItem("cc_nombre")||"";
  $("telefono").value=localStorage.getItem("cc_tel")||"";
  $("origen").value=localStorage.getItem("cc_origen")||"";
};
window.enviar=async()=>{
  const data={ origen:$("origen").value, destino:$("destino").value, nombre:$("nombre").value, telefono:$("telefono").value, tipo:$("tipo").value, desc:$("desc").value, estado:"nuevo", createdAt: serverTimestamp() };
  if(!data.origen||!data.destino||!data.telefono||!data.nombre||!data.tipo) return alert("Completa todos los campos");
  localStorage.setItem("cc_nombre",data.nombre); localStorage.setItem("cc_tel",data.telefono); localStorage.setItem("cc_origen",data.origen);
  await addDoc(collection(db,"servicios"), data);
  alert("¡Solicitud enviada! Te contactamos por WhatsApp");
};
</script>
</body>
</html>
