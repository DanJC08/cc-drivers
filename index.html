<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CC Drivers - Cliente</title>
<style>body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:15px}.card{max-width:480px;margin:auto;background:white;padding:20px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}h1{text-align:center}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}button{width:100%;padding:14px;background:#000;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:bold;margin-top:10px}#estado{margin-top:15px;padding:12px;border-radius:10px;display:none;text-align:center}.wait{background:#fef3c7}</style></head><body><div class="card"><h1>🚗 CC Drivers</h1><p style="text-align:center;color:#666">Solicita tu viaje - PRUEBA</p><input id="nombre" placeholder="Tu nombre"><input id="telefono" placeholder="WhatsApp"><input id="origen" placeholder="Origen"><input id="destino" placeholder="Destino"><button id="btn">Solicitar Viaje</button><div id="estado"></div><p style="text-align:center;margin-top:15px"><a href="conductores.html">Panel conductores</a></p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
document.getElementById('btn').onclick=async()=>{
 const n=document.getElementById('nombre').value,o=document.getElementById('origen').value,d=document.getElementById('destino').value,t=document.getElementById('telefono').value;
 if(!n||!o||!d){alert('Llena los datos');return}
 try{await addDoc(collection(db,"servicios_prueba"),{cliente:n,telefono:t,origen:o,destino:d,estado:"pendiente",creado:serverTimestamp()});document.getElementById('estado').style.display='block';document.getElementById('estado').className='wait';document.getElementById('estado').innerHTML='✅ Viaje enviado a conductores';}catch(e){alert(e.message)}
};
</script></body></html>  <div class="search-pill" onclick="document.getElementById('origen').focus()">
    <span class="icon">🔍</span>

  </div>

  <!-- DESTINO CON TU ESTILO EXACTO DE LA IMAGEN -->
  <label class="label">Destino</label>

  <label class="label">Tipo de servicio</label>

    <option value="">Selecciona...</option>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "TU_API_KEY_AQUI", authDomain: "cc-drivers.firebaseapp.com", projectId: "cc-drivers" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const $=id=>document.getElementById(id);

function initMaps(){
  const opts={componentRestrictions:{country:"mx"},fields:["formatted_address","name"]};
  new google.maps.places.Autocomplete($("origen"),opts).addListener("place_changed",function(){ $("origen").value=this.getPlace().formatted_address||this.getPlace().name; });
  new google.maps.places.Autocomplete($("destino"),opts).addListener("place_changed",function(){ $("destino").value=this.getPlace().formatted_address||this.getPlace().name; });
}
window.onload=()=>{ initMaps();
  $("nombre").value=localStorage.getItem("cc_nombre")||"";
  $("telefono").value=localStorage.getItem("cc_tel")||"";
  $("origen").value=localStorage.getItem("cc_origen")||"";
};
window.enviar=async()=>{
  const data={ origen:$("origen").value, destino:$("destino").value, nombre:$("nombre").value, telefono:$("telefono").value, tipo:$("tipo").value, desc:$("desc").value, estado:"nuevo", createdAt: serverTimestamp() };
  if(!data.origen||!data.destino||!data.telefono||!data.nombre||!data.tipo) return alert("Completa todos los campos");
  localStorage.setItem("cc_nombre",data.nombre); localStorage.setItem("cc_tel",data.telefono); localStorage.setItem("cc_origen",data.origen);
  await addDoc(collection(db,"servicios"), data);
  alert("¡Solicitud enviada! Te contactamos por WhatsApp");
};
</script>
</body>
