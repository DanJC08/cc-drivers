<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Usuarios</title>
<style>
:root{--azul:#0A1931;--naranja:#FF7A00}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#F8FAFC;color:var(--azul);padding-bottom:20px}
.header{background:var(--azul);color:#C5A880;padding:12px 14px;display:flex;gap:10px;font-weight:900;position:sticky;top:0;align-items:center;z-index:10}
.logo{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--azul);border:2px solid #C5A880;font-weight:900}
.container{max-width:480px;margin:auto;padding:14px}
.search-pill{background:#fff;border-radius:999px;padding:18px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin:12px 0;border:1px solid #E2E8F0}
.search-pill input{border:0;outline:0;width:100%;font-size:16px;color:var(--azul)}
.search-pill span{font-size:20px}
.card-data{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-top:10px}
.card-data input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.btn-main{width:100%;padding:16px;background:var(--azul);color:#fff;border:0;border-radius:14px;font-size:18px;font-weight:800;margin-top:12px}
.btn-main:disabled{opacity:.5}
#estado{margin-top:12px;padding:12px;border-radius:10px;display:none;text-align:center;font-weight:700}
.ok{background:#FEF3C7;color:#92400E}
</style>
</head>
<body>
<div class="header"><div class="logo">CC</div> CC DRIVERS</div>
<div class="container">
  <div class="search-pill"><span>🔍</span><input id="origen" placeholder="¿Dónde te recogemos?"></div>
  <div class="search-pill"><span>📍</span><input id="destino" placeholder="¿A dónde vas?"></div>
  
  <div class="card-data">
    <input id="nombre" placeholder="Tu nombre" value="Daniel">
    <input id="telefono" placeholder="WhatsApp" value="3319173645">
    <button id="btn" class="btn-main">Solicitar Viaje</button>
    <div id="estado"></div>
    <p style="text-align:center"><a href="conductores.html" style="color:var(--azul)">Panel conductores</a></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

document.getElementById('btn').onclick=async()=>{
 const n=document.getElementById('nombre').value.trim();
 const t=document.getElementById('telefono').value.trim();
 const o=document.getElementById('origen').value.trim();
 const d=document.getElementById('destino').value.trim();
 if(!n||!o||!d){alert('Llena origen, destino y nombre');return}
 const btn=document.getElementById('btn');
 btn.disabled=true; btn.textContent='Enviando...';
 try{
   await addDoc(collection(db,"servicios_prueba"),{
     cliente:n,telefono:t,origen:o,destino:d,
     estado:"pendiente",creado:serverTimestamp()
   });
   const e=document.getElementById('estado');
   e.style.display='block'; e.className='ok'; e.innerHTML='✅ Viaje enviado a conductores';
   btn.textContent='Viaje Enviado';
 }catch(err){alert(err.message); btn.disabled=false; btn.textContent='Solicitar Viaje';}
};
</script>
</body>
</html>
  <label class="label">Detalles</label>
  <textarea id="desc" rows="4" placeholder="Describe tu servicio..."></textarea>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "TU_API_KEY_AQUI", authDomain: "cc-drivers.firebaseapp.com", projectId: "cc-drivers" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const $=id=>document.getElementById(id);

function initMaps(){
  const opts={componentRestrictions:{country:"mx"},fields:["formatted_address","name"]};
  new google.maps.places.Autocomplete($("origen"),opts).addListener("place_changed",function(){ $("origen").value=this.getPlace().formatted_address||this.getPlace().name; });
  new google.maps.places.Autocomplete($("destino"),opts).addListener("place_changed",function(){ $("destino").value=this.getPlace().formatted_address||this.getPlace().name; });
}
window.onload=()=>{ initMaps();
  $("nombre").value=localStorage.getItem("cc_nombre")||"";
  $("telefono").value=localStorage.getItem("cc_tel")||"";
  $("origen").value=localStorage.getItem("cc_origen")||"";
};
window.enviar=async()=>{
  const data={ origen:$("origen").value, destino:$("destino").value, nombre:$("nombre").value, telefono:$("telefono").value, tipo:$("tipo").value, desc:$("desc").value, estado:"nuevo", createdAt: serverTimestamp() };
  if(!data.origen||!data.destino||!data.telefono||!data.nombre||!data.tipo) return alert("Completa todos los campos");
  localStorage.setItem("cc_nombre",data.nombre); localStorage.setItem("cc_tel",data.telefono); localStorage.setItem("cc_origen",data.origen);
  await addDoc(collection(db,"servicios"), data);
  alert("¡Solicitud enviada! Te contactamos por WhatsApp");
};
</script>
</body>
</html>
