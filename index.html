<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CC VIAJES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#F2F2F7;display:flex;justify-content:center;min-height:100vh}
.iphone{width:100%;max-width:430px;background:#F2F2F7;min-height:100vh;position:relative}
.header{background:#0A1931;color:#C5A880;padding:16px 20px;display:flex;align-items:center;gap:12px;font-weight:900;height:64px}
.logo{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0A1931;border:2px solid #C5A880;font-size:13px;font-weight:900}
.content{padding:24px 16px 100px}
.tit{font-size:32px;font-weight:800;line-height:.95;letter-spacing:-1px;margin-bottom:20px;color:#0A1931}.tit span{color:#FF7A00}
.wrap{position:relative;width:100%;margin-bottom:12px}
.pill{background:#fff;width:100%;border-radius:18px;padding:0 12px 0 16px;height:62px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.05)}
.pill input{border:0;outline:0;width:100%;font-size:17px;font-weight:500;background:transparent;color:#0A1931}
.card{background:#fff;border-radius:20px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-top:6px}
.card input{width:100%;border:0;border-bottom:1px solid #F2F2F7;padding:18px 12px;outline:0;font-size:17px}
.btn{width:100%;height:56px;background:#111;color:#fff;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:12px}
.btn:disabled{opacity:.5}
#estado{margin-top:12px;padding:14px;border-radius:12px;text-align:center;display:none;font-size:14px;font-weight:600;line-height:1.3}
.ok{background:#D1FFE0;color:#0a5a2a;display:block!important}
.err{background:#FFE0E0;color:#7a0000;display:block!important}
.sugerencias{background:#fff;border-radius:14px;margin-top:6px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:240px;overflow:auto;display:none;position:absolute;z-index:100;left:0;right:0;top:66px;border:1px solid rgba(0,0,0,.06)}
.sugerencias div{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.sugerencias div:hover{background:#F5F5F7}
.sugerencias b{font-size:14px;display:block;color:#0A1931}
.sugerencias small{color:#8E8E93;font-size:11px}
.gps-dot{width:8px;height:8px;background:#34C759;border-radius:50%;display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.precioBox{background:#0A1931;border-radius:18px;padding:14px 16px;display:none;justify-content:space-between;align-items:center;margin-bottom:12px;border:1px solid #C5A880}
.precioBox b{color:#fff;font-size:22px}.precioBox small{color:#C5A880;display:block;font-size:11px}
</style>
</head>
<body>
<div class="iphone">
  <div class="header"><div class="logo">CC</div>VIAJES</div>
  <div class="content">
    <div class="tit">¿A dónde<br><span>vamos hoy?</span></div>
    <div style="font-size:12px;color:#8E8E93;margin:-12px 0 14px 4px" id="gpsInfo">📍 Detectando tu ubicación...</div>
    <div class="wrap"><div class="pill"><span>●</span><input id="origen" placeholder="¿Dónde te recogemos?" autocomplete="off"></div><div id="sug-origen" class="sugerencias"></div></div>
    <div class="wrap"><div class="pill"><span>📍</span><input id="destino" placeholder="¿A dónde vas?" autocomplete="off"></div><div id="sug-destino" class="sugerencias"></div></div>

    <div id="precioBox" class="precioBox">
      <div><small id="precioDetalle">-- min sin tráfico</small><b id="precioTotal">$--</b></div>
      <div style="text-align:right"><small style="color:#fff">Tarifa estimada</small></div>
    </div>

    <div class="wrap">
      <div class="pill">
        <input type="text" id="fechaHora" placeholder="¿A qué hora? (opcional)"
          onclick="if(this.type==='text'){this.type='datetime-local'; setTimeout(()=>this.showPicker&&this.showPicker(),100)}"
          onfocus="if(this.type==='text'){this.type='datetime-local'; setTimeout(()=>this.showPicker&&this.showPicker(),100)}"
          onblur="if(!this.value) this.type='text'">
      </div>
    </div>
    <div class="card">
      <input id="nombre" placeholder="Tu nombre">
      <input id="telefono" placeholder="Tu celular" inputmode="numeric">
      <button id="btn" class="btn">Solicitar Viaje</button>
      <div id="estado"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, onSnapshot, getDocs, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"}));

const origenInput = document.getElementById('origen');
const destinoInput = document.getElementById('destino');
const sugO = document.getElementById('sug-origen');
const sugD = document.getElementById('sug-destino');
const gpsInfo = document.getElementById('gpsInfo');
const precioBox = document.getElementById('precioBox');
const precioTotalEl = document.getElementById('precioTotal');
const precioDetalleEl = document.getElementById('precioDetalle');

let origenCoords = null, destinoCoords = null;
let userCoords = null;
let unsubViaje = null;

let tarifa = {base:20, por_km:10, por_min:1.5, minimo:50, factor_demanda:1.0, extra_nocturno:15, extra_lluvia:0};
let ultimoCalculo = null;

try{
  const tSnap = await getDoc(doc(db, "config", "tarifas"));
  if(tSnap.exists()){
    const d = tSnap.data();
    tarifa = {
      base: Number(d.base) || 25,
      por_km: Number(d.por_km) || 12,
      por_min: Number(d.por_min) || 1.5,
      minimo: Number(d.minimo) || 50,
      factor_demanda: Number(d.factor_demanda) || 1.0,
      extra_nocturno: Number(d.extra_nocturno) || 0,
      extra_lluvia: Number(d.extra_lluvia) || 0
    };
  }
  onSnapshot(doc(db,"config","tarifas"), (snap)=>{
    if(snap.exists()){
      const d = snap.data();
      tarifa.base = Number(d.base) || tarifa.base;
      tarifa.por_km = Number(d.por_km) || tarifa.por_km;
      tarifa.por_min = Number(d.por_min) || tarifa.por_min;
      tarifa.minimo = Number(d.minimo) || tarifa.minimo;
      tarifa.factor_demanda = Number(d.factor_demanda) || 1.0;
      tarifa.extra_nocturno = Number(d.extra_nocturno) || 0;
      tarifa.extra_lluvia = Number(d.extra_lluvia) || 0;
      actualizarPrecioUI();
    }
  });
}catch(e){}

navigator.geolocation.getCurrentPosition(pos=>{
  userCoords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
  gpsInfo.innerHTML = `<span class="gps-dot"></span> Ubicado a ${userCoords.lat.toFixed(4)}, ${userCoords.lng.toFixed(4)} • Sugerencias cercanas activas`;
}, ()=>{ gpsInfo.textContent = "📍 Sin GPS - Sugerencias en todo México"; }, {enableHighAccuracy:true, timeout:8000});

function calcDistKm(a,b){
  const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function calcularPrecioFinal(distKm){
  const ahora = new Date();
  const hora = ahora.getHours();
  const duracionMin = (distKm / 30) * 60;
  let precio = tarifa.base + (distKm * tarifa.por_km) + (duracionMin * tarifa.por_min);
  let extras = [];
  if(tarifa.factor_demanda > 1){ extras.push(`x${tarifa.factor_demanda} demanda`); precio = precio * tarifa.factor_demanda; }
  if((hora >= 22 || hora < 6) && tarifa.extra_nocturno > 0){ extras.push(`+$${tarifa.extra_nocturno} nocturno`); precio += tarifa.extra_nocturno; }
  if(tarifa.extra_lluvia > 0){ extras.push(`+$${tarifa.extra_lluvia} lluvia`); precio += tarifa.extra_lluvia; }
  precio = Math.max(precio, tarifa.minimo);
  precio = Math.round(precio/5)*5;
  return {precio, minutos: Math.round(duracionMin), extras, distKm};
}

function actualizarPrecioUI(){
  if(!origenCoords ||!destinoCoords) { precioBox.style.display='none'; return; }
  const dist = calcDistKm(origenCoords, destinoCoords) * 1.3;
  const calc = calcularPrecioFinal(dist);
  ultimoCalculo = calc;
  precioDetalleEl.textContent = `${calc.minutos} min sin tráfico`;
  precioTotalEl.textContent = `$${calc.precio}`;
  precioBox.style.display='flex';
}

async function buscarOSM(q){
  let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=mx&limit=15&addressdetails=1`;
  if(userCoords){
    const delta = 0.08;
    url += `&viewbox=${userCoords.lng-delta},${userCoords.lat+delta},${userCoords.lng+delta},${userCoords.lat-delta}&bounded=0&lat=${userCoords.lat}&lon=${userCoords.lng}`;
  }
  const r = await fetch(url, {headers:{'Accept-Language':'es'}});
  let res = await r.json();
  if(userCoords && res.length){
    res = res.map(p=>({...p, _dist: calcDistKm(userCoords, {lat:parseFloat(p.lat), lng:parseFloat(p.lon)})})).sort((a,b)=>a._dist-b._dist);
  }
  return res.slice(0,6);
}

function setupAutocomplete(input, sugDiv, setCoords){
  let t=null;
  async function seleccionarMiUbicacion(){
    if(!userCoords){ alert("Activa tu GPS"); return; }
    input.value = "Detectando tu dirección...";
    sugDiv.style.display='none';
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userCoords.lat}&lon=${userCoords.lng}&zoom=18&addressdetails=1`);
      const data = await r.json();
      const calle = data.address.road || data.address.neighbourhood || "Mi ubicación";
      const numero = data.address.house_number? ` ${data.address.house_number}` : "";
      const colonia = data.address.suburb || "";
      const direccionBonita = colonia? `${calle}${numero}, ${colonia}` : data.display_name.split(',').slice(0,3).join(', ');
      input.value = direccionBonita;
      setCoords({lat:userCoords.lat, lng:userCoords.lng});
      actualizarPrecioUI();
    }catch(e){
      input.value = "Mi ubicación actual";
      setCoords({lat:userCoords.lat, lng:userCoords.lng});
      actualizarPrecioUI();
    }
  }
  function pintarSugerencias(res, esOrigen){
    sugDiv.innerHTML='';
    if(esOrigen && userCoords){
      const divMiUbi = document.createElement('div');
      divMiUbi.style.background = "#F0F9FF";
      divMiUbi.innerHTML = `<b>📍 Mi ubicación</b><small>Usar tu ubicación actual</small>`;
      divMiUbi.onclick = seleccionarMiUbicacion;
      sugDiv.appendChild(divMiUbi);
    }
    res.forEach(p=>{
      const div=document.createElement('div');
      const corto = p.display_name.split(',').slice(0,3).join(', ');
      const dist = p._dist? `${p._dist.toFixed(1)} km de ti` : p.address?.city || '';
      div.innerHTML = `<b>${corto}</b><small>📍 ${dist}</small>`;
      div.onclick=()=>{
        input.value = corto;
        setCoords({lat:parseFloat(p.lat), lng:parseFloat(p.lon)});
        sugDiv.style.display='none';
        actualizarPrecioUI();
      };
      sugDiv.appendChild(div);
    });
    sugDiv.style.display = 'block';
  }
  input.addEventListener('focus', ()=>{
    if(input===origenInput && userCoords && input.value.trim().length<2){
      pintarSugerencias([], true);
    }
  });
  input.addEventListener('input', ()=>{
    clearTimeout(t);
    const q=input.value.trim();
    setCoords(null);
    actualizarPrecioUI();
    if(q.length<2){
      if(input===origenInput && userCoords){ pintarSugerencias([], true); }
      else sugDiv.style.display='none';
      return;
    }
    t=setTimeout(async()=>{
      const res = await buscarOSM(q);
      pintarSugerencias(res, input===origenInput);
    },300);
  });
  document.addEventListener('click', (e)=>{ if(!sugDiv.contains(e.target) && e.target!==input) sugDiv.style.display='none'; });
}

setupAutocomplete(origenInput, sugO, c=>origenCoords=c);
setupAutocomplete(destinoInput, sugD, c=>destinoCoords=c);

document.getElementById('btn').onclick=async()=>{
  const o=origenInput.value.trim(), d=destinoInput.value.trim();
  const nombre=document.getElementById('nombre').value.trim()||'Cliente';
  const tel=document.getElementById('telefono').value.trim();
  const estado=document.getElementById('estado');
  const btn=document.getElementById('btn');
  if(!o||!d){ alert("Pon origen y destino"); return; }
  if(tel.length<10){ alert("Celular a 10 dígitos"); return; }
  if(unsubViaje){ unsubViaje(); unsubViaje=null; }
  btn.disabled=true; btn.textContent='Enviando...';
  estado.style.display='none';
  try{
    if(!origenCoords){ const r=await buscarOSM(o); if(!r[0]) throw "Origen no encontrado"; origenCoords={lat:parseFloat(r[0].lat), lng:parseFloat(r[0].lon)}; }
    if(!destinoCoords){ const r=await buscarOSM(d); if(!r[0]) throw "Destino no encontrado"; destinoCoords={lat:parseFloat(r[0].lat), lng:parseFloat(r[0].lon)}; }
    if(!ultimoCalculo) actualizarPrecioUI();
    const dist = ultimoCalculo?.distKm || calcDistKm(origenCoords, destinoCoords) * 1.3;
    const calc = ultimoCalculo || calcularPrecioFinal(dist);
    let etaTexto = 'Buscando conductor más cercano...';
    try{
      const snapCond = await getDocs(collection(db,"conductores"));
      let masCercanoKm = null;
      snapCond.forEach(docu=>{
        const c=docu.data();
        const lat=c.lat||c.latitud||c.origenLat;
        const lng=c.lng||c.longitud||c.origenLng;
        if(!lat||!lng) return;
        if(c.aprobado===false) return;
        const km = calcDistKm(origenCoords, {lat,lng});
        if(masCercanoKm===null || km<masCercanoKm) masCercanoKm=km;
      });
      if(masCercanoKm!==null){
        const mins = Math.max(1, Math.round((masCercanoKm/30)*60));
        etaTexto = `Conductor más cercano a ${mins} min de ti 🚗💨`;
      }
    }catch(e){}
    const docRef = await addDoc(collection(db,"servicios_prueba"),{
      cliente:nombre, telefono:tel, origen:o, destino:d,
      origenLat:origenCoords.lat, origenLng:origenCoords.lng,
      destinoLat:destinoCoords.lat, destinoLng:destinoCoords.lng,
      distanciaOrigenDestino:dist, distanciaTotal:dist,
      precioEstimado: calc.precio,
      precioFinal: calc.precio,
      tiempoMin: calc.minutos,
      tarifaUsada: tarifa,
      extras: calc.extras.join(", "),
      estado: document.getElementById('fechaHora').value?'programado':'pendiente',
      fechaHoraProgramada: document.getElementById('fechaHora').value? new Date(document.getElementById('fechaHora').value).toISOString():null,
      creado:serverTimestamp(),
      clienteLat:userCoords?.lat||null, clienteLng:userCoords?.lng||null
    });
    estado.innerHTML = `✅ Viaje enviado<br><small>💰 Precio: $${calc.precio}<br>🔍 ${etaTexto}</small>`;
    estado.className='ok'; estado.style.display='block';
    btn.textContent='Buscando conductor...';
    unsubViaje = onSnapshot(doc(db, "servicios_prueba", docRef.id), (snap)=>{
      if(!snap.exists()) return;
      const v=snap.data();
      if(v.estado==='tomado' || v.conductorNombre){
        let kmC = v.distanciaConductorOrigen || v.distanciaConductor || 0;
        if(!kmC){
          const latC = v.conductorLat || v.latConductor;
          const lngC = v.conductorLng || v.lngConductor;
          if(latC && lngC && v.origenLat){
            kmC = calcDistKm({lat:v.origenLat, lng:v.origenLng}, {lat:latC, lng:lngC});
          }
        }
        let tiempoTxt = kmC>0? `a ${Math.max(1,Math.round((kmC/30)*60))} min • ${kmC.toFixed(1)} km de ti` : `en camino hacia ti`;
        const telC = v.conductorTelefono||'';
        estado.innerHTML = `<div style="text-align:left"><div style="font-size:16px">✅ <b>${v.conductorNombre||'Conductor'} tomó tu viaje</b></div><div style="margin-top:6px">🚗 <b>${tiempoTxt}</b></div><div>💰 Total: $${v.precioFinal||calc.precio}</div>${telC?`<a href="https://wa.me/52${telC.replace(/[^0-9]/g,'').slice(-10)}" target="_blank" style="display:block;margin-top:10px;background:#111;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none">WhatsApp al conductor</a>`:''}</div>`;
        btn.textContent='Conductor asignado'; btn.disabled=true;
      }
    });
    origenInput.value=''; destinoInput.value=''; document.getElementById('fechaHora').value='';
    origenCoords=null; destinoCoords=null; precioBox.style.display='none';
  }catch(e){ console.error(e); estado.textContent='❌ '+e; estado.className='err'; estado.style.display='block'; btn.textContent='Solicitar Viaje'; btn.disabled=false; }
};
</script>
</body>
</html>
