<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conductores</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;margin:0;padding:10px}.card{background:#222;padding:15px;border-radius:12px;margin:10px 0;border-left:5px solid #facc15}button{padding:10px;border:0;border-radius:8px;font-weight:bold;margin-top:5px}.tomar{background:#22c55e}#lista{max-width:600px;margin:auto}</style></head><body><h1 style="text-align:center">🚕 Panel Conductores PRUEBA</h1><div id="lista">Cargando...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
const lista=document.getElementById('lista');
const q=query(collection(db,"servicios_prueba"),where("estado","==","pendiente"));
onSnapshot(q,(s)=>{if(s.empty){lista.innerHTML='Sin viajes';return}lista.innerHTML='';s.forEach(docu=>{const v=docu.data();const div=document.createElement('div');div.className='card';div.innerHTML=`<b>${v.cliente}</b> - ${v.telefono}<br>De: ${v.origen}<br>A: ${v.destino}<br><button class="tomar">Tomar viaje</button>`;div.querySelector('.tomar').onclick=async()=>{await updateDoc(doc(db,"servicios_prueba",docu.id),{estado:"tomado"})};lista.prepend(div)})});
</script></body></html></html>
