<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Conductores</title>
<style>
:root{--azul:#0A1931;--naranja:#FF7A00;--beige:#C5A880}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#F1F5F9;color:var(--azul);padding-bottom:30px}
.header{background:var(--azul);color:var(--beige);padding:12px 14px;display:flex;gap:10px;font-weight:900;position:sticky;top:0;align-items:center;z-index:10;justify-content:space-between}
.logo{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--azul);border:2px solid var(--beige);font-weight:900}
.container{max-width:560px;margin:auto;padding:14px}
.pill-top{background:#fff;border-radius:999px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.08);font-weight:800}
.live-dot{width:10px;height:10px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 6px 18px rgba(10,25,49,.08);border-left:6px solid var(--naranja);animation:entra .3s ease}
@keyframes entra{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.card b{font-size:18px}
.ruta{margin:10px 0;line-height:1.6}
.ruta div{display:flex;gap:8px;align-items:center}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-tomar{flex:1;padding:14px;background:var(--azul);color:#fff;border:0;border-radius:12px;font-weight:900;font-size:16px}
.btn-what{padding:14px 18px;background:#25D366;color:#fff;border:0;border-radius:12px;font-weight:900;text-decoration:none;display:flex;align-items:center}
.vacio{text-align:center;padding:60px 20px;color:#64748B}
#contador{background:var(--naranja);color:#fff;padding:4px 10px;border-radius:999px;font-size:13px}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;gap:10px;align-items:center"><div class="logo">CC</div> CONDUCTORES</div>
  <div style="display:flex;gap:8px;align-items:center"><span class="live-dot"></span> <span id="contador">0</span></div>
</div>

<div class="container">
  <div class="pill-top"><span>🔔 Viajes en tiempo real</span><span>PRUEBA</span></div>
  <div id="lista"><div class="vacio">Esperando viajes...<br><small>Deja esta pantalla abierta</small></div></div>
</div>

<audio id="ding" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const lista=document.getElementById('lista');
const contador=document.getElementById('contador');
const ding=document.getElementById('ding');

const q=query(collection(db,"servicios_prueba"),where("estado","==","pendiente"));

onSnapshot(q,(snap)=>{
  if(snap.empty){lista.innerHTML='<div class="vacio">Sin viajes pendientes<br><small>Los nuevos aparecerán aquí automáticamente</small></div>';contador.textContent='0';return}
  contador.textContent=snap.size;
  lista.innerHTML='';
  // Sonido cuando llega uno nuevo
  if(snap.docChanges().some(c=>c.type==='added')){try{ding.play()}catch(e){}}
  
  snap.forEach(docu=>{
    const v=docu.data();
    const div=document.createElement('div');
    div.className='card';
    const tel = v.telefono ? v.telefono.replace(/[^0-9]/g,'') : '';
    div.innerHTML=`
      <b>👤 ${v.cliente||'Cliente'}</b> <small style="color:#64748B">- ${v.telefono||''}</small>
      <div class="ruta">
        <div>🟠 <b>Recoger:</b> ${v.origen}</div>
        <div>🔵 <b>Destino:</b> ${v.destino}</div>
      </div>
      <div class="btn-row">
        <button class="btn-tomar">✅ Tomar Viaje</button>
        ${tel?`<a class="btn-what" href="https://wa.me/${tel}" target="_blank">WhatsApp</a>`:''}
      </div>
    `;
    div.querySelector('.btn-tomar').onclick=async()=>{
      if(!confirm(`¿Tomar viaje de ${v.cliente}?\n${v.origen} -> ${v.destino}`))return;
      await updateDoc(doc(db,"servicios_prueba",docu.id),{estado:"tomado", conductor_tomado: new Date().toISOString()});
    };
    lista.prepend(div);
  });
});
</script>
</body>
</html>
