<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CC Conductores</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--azul:#0A1931;--naranja:#FF7A00;--bg:#F5F5F7}
body{margin:0;background:var(--bg);display:flex;justify-content:center;min-height:100vh}
.iphone{width:100%;max-width:430px;background:var(--bg);min-height:100vh;position:relative;box-shadow:0 0 0 1px #e5e5e5, 0 20px 60px rgba(0,0,0,.15);overflow:hidden}
.header{background:var(--azul);color:#C5A880;padding:18px 20px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--azul);border:2px solid #C5A880;font-weight:900;font-size:14px}
.content{padding:16px 16px 100px}
.title{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:10px 4px 6px}
.sub{color:#8E8E93;font-size:14px;margin:0 4px 16px;font-weight:500}
.top-pill{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.06);font-weight:700;font-size:14px}
.live{display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;background:#34C759;border-radius:50%;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.badge{background:var(--naranja);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}
.card.activo{border:2px solid #C5A880; background:#FFFBF7}
.cliente{font-weight:800;font-size:17px}
.tel{font-size:13px;color:#8E8E93;background:#F5F5F7;padding:4px 8px;border-radius:8px}
.hora-pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:20px;display:inline-block;margin-bottom:10px}
.prog{background:#FFF7D1;color:#7a5a00;border:1px solid #FFE58F}
.ahora{background:#E6FFF0;color:#0a7a2f;border:1px solid #b6f5c6}
.dist-tag{background:#0A1931;color:#C5A880;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;margin-left:6px}
.dist-tag2{background:#FF7A00;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;margin-left:6px}
.precio-box{background:#111;color:#fff;border-radius:14px;padding:12px 14px;flex:1;display:flex;flex-direction:column;justify-content:center}
.precio-box b{font-size:22px;color:#C5A880}
.ruta{position:relative;padding-left:28px}
.ruta::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(to bottom, #D1D1D6 0 4px, transparent 4px 8px)}
.line{display:flex;gap:10px;margin:14px 0;align-items:flex-start}
.dot-o{width:16px;height:16px;background:var(--azul);border-radius:50%;border:3px solid #E5EFFF;flex-shrink:0;margin-top:2px}
.dot-d{width:16px;height:16px;background:var(--naranja);border-radius:50%;border:3px solid #FFEAD1;flex-shrink:0;margin-top:2px}
.btn-tomar{flex:1;padding:18px;background:#111;color:#fff;border:0;border-radius:14px;font-weight:800;font-size:17px}
.btn-tomar:active{transform:scale(.97)}
.btn-finalizar{flex:1;padding:18px;background:var(--azul);color:#C5A880;border:2px solid #C5A880;border-radius:14px;font-weight:800;font-size:17px}
.btn-finalizar:active{transform:scale(.97)}
.btn-maps-icon{width:56px;height:56px;min-width:56px;background:#fff;color:#0A1931;border:2px solid #0A1931;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-maps-icon:active{transform:scale(.95);background:#F2F2F7}
.row-precio{display:flex;gap:10px;margin-top:12px;align-items:stretch}
.row-acciones{display:flex;gap:10px;margin-top:10px;align-items:stretch}
.vacio{text-align:center;padding:80px 20px;color:#8E8E93}
.tab-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.08);padding:12px 20px 30px;display:flex;justify-content:space-between}
.tab-bar a{color:var(--azul);text-decoration:none;font-size:13px;font-weight:600;opacity:.6}
</style>
</head>
<body>
<div class="iphone">
  <div class="header"><div style="display:flex;gap:10px;align-items:center"><div class="logo">CC</div> CONDUCTORES</div><div class="badge" id="contador">0</div></div>
  <div class="content">
    <div class="title">Viajes nuevos</div>
    <div class="sub" id="subInfo">Cargando...</div>
    <div class="top-pill"><div class="live"><div class="dot"></div> Escuchando</div><span id="status">Conectado</span></div>
    <div id="lista"><div class="vacio"><div>📡</div>Esperando viajes...</div></div>
  </div>
  <div class="tab-bar"><a href="#" id="logout">Cerrar sesión</a><a href="index.html">← Cliente</a></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc, limit, onSnapshot as onSnapshotDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const lista=document.getElementById('lista'), contador=document.getElementById('contador'), subInfo=document.getElementById('subInfo');

let tarifa = {base:20, por_km:10, por_min:1.5, minimo:35, factor_demanda:1.0, extra_nocturno:10, extra_lluvia:0};
try{
  const snapTarifa = await getDoc(doc(db,"config","tarifas"));
  if(snapTarifa.exists()){
    const d=snapTarifa.data();
    tarifa.base = Number(d.base)||20; tarifa.por_km = Number(d.por_km)||10; tarifa.por_min = Number(d.por_min)||1.5; tarifa.minimo = Number(d.minimo)||35;
    tarifa.factor_demanda = Number(d.factor_demanda)||1.0; tarifa.extra_nocturno = Number(d.extra_nocturno)||0; tarifa.extra_lluvia = Number(d.extra_lluvia)||0;
  }
  onSnapshotDoc(doc(db,"config","tarifas"), s=>{
    if(!s.exists()) return; const d=s.data();
    tarifa.base = Number(d.base)||tarifa.base; tarifa.por_km = Number(d.por_km)||tarifa.por_km; tarifa.por_min = Number(d.por_min)||tarifa.por_min;
    tarifa.minimo = Number(d.minimo)||tarifa.minimo; tarifa.factor_demanda = Number(d.factor_demanda)||1.0;
    tarifa.extra_nocturno = Number(d.extra_nocturno)||0; tarifa.extra_lluvia = Number(d.extra_lluvia)||0; render();
  });
}catch(e){}

let conductorCoords = null; let conductorData = null; let viajesPendientes = []; let viajesTomados = []; let prevCount = -1;
let unsubPendientes = null; let unsubTomados = null; let ultimoUpdate = 0; let watchId = null;

const audio = new Audio('./mk64_toad01.wav'); audio.preload='auto'; audio.volume = 1.0; let audioListo=false;
function desbloquearAudio(){ if(audioListo) return; audio.play().then(()=>{audio.pause();audio.currentTime=0;audioListo=true;}).catch(()=>{}); }
document.addEventListener('click', desbloquearAudio, {once:true}); document.addEventListener('touchstart', desbloquearAudio, {once:true});
function sonar(){ desbloquearAudio(); audio.currentTime=0; audio.play().catch(()=>{}); if(navigator.vibrate) navigator.vibrate([400,100,400,100,400]); let o=document.title; document.title="🔥 ¡NUEVO VIAJE! 🔥"; setTimeout(()=>document.title=o,2000); }

document.getElementById('logout').onclick=async()=>{
  if(watchId) navigator.geolocation.clearWatch(watchId);
  await signOut(auth); location.href="login-conductores.html";
}

onAuthStateChanged(auth, async (user)=>{
  if(!user){ window.location.href="login-conductores.html"; return; }
  try{
    const snap=await getDoc(doc(db,"conductores",user.uid));
    if(!snap.exists() || snap.data().estado!=="aprobado"){ await signOut(auth); window.location.href="login-conductores.html"; return; }
    conductorData = {uid:user.uid,...snap.data()};
    subInfo.textContent = `👋 ${conductorData.nombre} • Base $${tarifa.base} • GPS buscando...`;
    if(unsubPendientes) unsubPendientes();
    const qPend = query(collection(db,"servicios_prueba"),where("estado","in",["pendiente","programado"]),limit(20));
    unsubPendientes = onSnapshot(qPend, (snap)=>{
      const nuevos=[]; snap.forEach(d=>nuevos.push({id:d.id,...d.data()}));
      nuevos.sort((a,b)=>{ if(a.estado==='pendiente'&&b.estado==='programado')return -1; if(a.estado==='programado'&&b.estado==='pendiente')return 1; return 0; });
      if(prevCount!==-1 && nuevos.length>prevCount) sonar();
      prevCount=nuevos.length; viajesPendientes=nuevos; render();
    });
    if(unsubTomados) unsubTomados();
    const qTom = query(collection(db,"servicios_prueba"),where("estado","==","tomado"),where("conductorId","==",user.uid));
    unsubTomados = onSnapshot(qTom, (snap)=>{ const arr=[]; snap.forEach(d=>arr.push({id:d.id,...d.data()})); viajesTomados = arr; render(); });
  }catch(e){ subInfo.textContent = "Error leyendo perfil: "+e.message; }
});

function calcKm(a,b){ const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLng=(b.lng-a.lng)*Math.PI/180; const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
function calcularPrecio(distKm){
  const min = (distKm/30)*60; let precio = tarifa.base + (distKm * tarifa.por_km) + (min * tarifa.por_min);
  const hora = new Date().getHours(); if(tarifa.factor_demanda>1) precio*=tarifa.factor_demanda;
  if((hora>=22||hora<6)&&tarifa.extra_nocturno>0) precio+=tarifa.extra_nocturno; if(tarifa.extra_lluvia>0) precio+=tarifa.extra_lluvia;
  precio = Math.max(precio, tarifa.minimo); return Math.round(precio/5)*5;
}
function actualizarDistancias(){
  if(!conductorCoords) return;
  document.querySelectorAll('.card[data-tipo="pendiente"]').forEach((card, i)=>{
    const v = viajesPendientes[i]; if(!v ||!v.origenLat ||!v.origenLng) return;
    const distCO = calcKm(conductorCoords, {lat:v.origenLat, lng:v.origenLng})*1.3;
    const tag = card.querySelector('.dist-tag'); if(tag) tag.textContent = distCO.toFixed(1)+' km de ti';
  });
}
watchId = navigator.geolocation.watchPosition(pos=>{
  conductorCoords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
  if(conductorData) subInfo.textContent = `👋 ${conductorData.nombre} • En viaje • Actualiza cada 1 min`;
  const ahora = Date.now();
  if(ahora - ultimoUpdate > 60000 && viajesTomados.length>0){
    ultimoUpdate = ahora;
    viajesTomados.forEach(v=>{ updateDoc(doc(db,"servicios_prueba",v.id),{ conductorLat: conductorCoords.lat, conductorLng: conductorCoords.lng, conductorLastUpdate: new Date().toISOString() }); });
  }
  actualizarDistancias();
}, ()=>{ subInfo.textContent=`Base $${tarifa.base} • Sin GPS`; }, {enableHighAccuracy:true, maximumAge:30000, timeout:15000});

function abrirNavegacion(v){
  let url = '';
  if(conductorCoords && v.origenLat && v.destinoLat){ url = `https://www.google.com/maps/dir/?api=1&origin=${conductorCoords.lat},${conductorCoords.lng}&destination=${v.destinoLat},${v.destinoLng}&waypoints=${v.origenLat},${v.origenLng}&travelmode=driving`; }
  else if(v.origenLat && v.destinoLat){ url = `https://www.google.com/maps/dir/?api=1&origin=${v.origenLat},${v.origenLng}&destination=${v.destinoLat},${v.destinoLng}&travelmode=driving`; }
  else { url = `https://www.google.com/maps/dir/${encodeURIComponent(v.origen)}/${encodeURIComponent(v.destino)}/`; }
  window.open(url, '_blank');
}

async function render(){
  const totalViajes = viajesPendientes.length + viajesTomados.length;
  contador.textContent = totalViajes; lista.innerHTML='';
  if(totalViajes===0){lista.innerHTML='<div class="vacio"><div>☕️</div>Sin viajes</div>';return;}

  for(let v of viajesTomados){
    const distOD = v.distanciaOrigenDestino || v.distanciaTotal || 0;
    const distCO = v.distanciaConductorOrigen || 0;
    const precio = v.precioCobrado || v.precio || v.precioCliente || v.precioEstimado || calcularPrecio(distOD);
    const fechaHoraHtml = v.fechaHoraProgramada ? `<div class="hora-pill prog">⏰ ${new Date(v.fechaHoraProgramada).toLocaleString('es-MX',{dateStyle:'short', timeStyle:'short'})}</div>` : `<div class="hora-pill ahora">🔥 AHORA • A ${distCO? distCO.toFixed(1)+' km de ti' : 'cerca'}</div>`;
    const card=document.createElement('div'); card.className='card activo'; card.dataset.tipo="tomado";
    card.innerHTML=`
      ${fechaHoraHtml}
      <div class="card-top" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="cliente">${v.cliente||'Cliente'}</span><span class="tel">${v.telefono||''}</span></div>
      <div class="ruta">
        <div class="line"><div class="dot-o"></div><div><small style="color:#8E8E93;font-size:11px;font-weight:700">RECOGER <span class="dist-tag">${distCO? distCO.toFixed(1)+' km de ti' : ''}</span></small><br><b>${v.origen}</b></div></div>
        <div class="line"><div class="dot-d"></div><div><small style="color:#8E8E93;font-size:11px;font-weight:700">DESTINO <span class="dist-tag2">${distOD? distOD.toFixed(1)+' km' : ''}</span></small><br><b>${v.destino}</b></div></div>
      </div>
      <div class="row-precio">
        <div class="precio-box">
          <div style="display:flex;justify-content:space-between"><small style="color:#8E8E93" class="precio-detalle">${distOD.toFixed(1)} km de viaje • Precio fijo cliente</small></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><b class="precio-valor">$${precio} MXN</b><span style="font-size:11px;color:#C5A880">En curso</span></div>
        </div>
        <button class="btn-maps-icon btn-wsp" title="WhatsApp">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#25D366"><path d="M19.05 4.94A9.82 9.82 0 0 0 12 1C6.49 1 2 5.38 2 10.79c0 1.73.52 3.43 1.5 4.88L2 23l7.58-1.98a9.7 9.7 0 0 0 2.42.32h.01c5.51 0 10-4.38 10-9.79 0-2.61-1.04-5.06-2.96-6.61Zm-7.05 15.2h-.01a8.08 8.08 0 0 1-4.12-1.12l-.29-.17-4.5 1.18 1.2-4.33-.19-.33a8.13 8.13 0 0 1-1.26-4.31c0-4.48 3.73-8.12 8.32-8.12 2.22 0 4.31.85 5.88 2.39a8.03 8.03 0 0 1 2.44 5.74c0 4.48-3.73 8.12-8.32 8.12Zm4.56-6.08c-.25-.12-1.47-.72-1.69-.8-.22-.08-.39-.12-.55.12-.16.25-.64.8-.78.97-.14.16-.29.19-.54.06-.25-.12-1.05-.38-2-1.22-.74-.65-1.24-1.45-1.38-1.69-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.55-1.32-.75-1.8-.2-.47-.4-.41-.55-.41h-.47c-.16 0-.43.06-.65.31-.22.25-.84.81-.84 1.98s.86 2.29.98 2.45c.12.16 1.7 2.57 4.11 3.6.57.24 1.02.38 1.37.49.57.18 1.09.15 1.5.09.46-.07 1.47-.59 1.67-1.16.21-.57.21-1.06.14-1.16-.06-.1-.23-.16-.48-.28Z"/></svg>
        </button>
      </div>
      <div class="row-acciones">
        <button class="btn-finalizar">✅ Finalizar viaje</button>
        <button class="btn-maps-icon btn-nav-completo" title="Navegación">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0A84FF" stroke="#0A84FF" stroke-width="2" stroke-linejoin="round"><path d="M3 11L22 2L13 21L11 13L3 11Z"/></svg>
        </button>
      </div>
    `;
    card.querySelector('.btn-nav-completo').onclick=()=>abrirNavegacion(v);
    card.querySelector('.btn-wsp').onclick=()=>{
      const telLimpio=(v.telefono||'').replace(/[^0-9]/g,''); if(!telLimpio) return alert("Sin teléfono");
      const msg = `Hola ${v.cliente||''} 👋\nSoy ${conductorData.nombre}, tu conductor de CC DRIVERS 🚗\nVoy en camino.\n\n💰 Precio del viaje: $${precio} MXN`;
      window.open(`https://wa.me/52${telLimpio}?text=${encodeURIComponent(msg)}`,'_blank');
    };
    card.querySelector('.btn-finalizar').onclick=async()=>{
      if(!confirm(`¿Finalizar viaje de ${v.cliente}?\n$${precio} MXN`)) return;
      if(watchId) navigator.geolocation.clearWatch(watchId);
      await updateDoc(doc(db,"servicios_prueba",v.id),{ estado:"finalizado", finalizadoEn:new Date().toISOString() });
    };
    lista.appendChild(card);
  }

  for(let v of viajesPendientes){
    const distOD = v.distanciaOrigenDestino || v.distanciaTotal || v.distancia || 0;
    let distCO = 0; if(conductorCoords && v.origenLat && v.origenLng){ distCO = calcKm(conductorCoords, {lat:v.origenLat, lng:v.origenLng})*1.3; }
    const precioFijo = v.precio || v.precioCliente || v.precioEstimado || calcularPrecio(distOD);
    const horaHtml = v.fechaHoraProgramada? `<div class="hora-pill prog">⏰ ${new Date(v.fechaHoraProgramada).toLocaleString('es-MX',{dateStyle:'short', timeStyle:'short'})}</div>` : `<div class="hora-pill ahora">🔥 AHORA • A ${distCO? distCO.toFixed(1)+' km de ti' : 'cerca'}</div>`;
    const card=document.createElement('div'); card.className='card'; card.dataset.tipo="pendiente";
    card.innerHTML=`
      ${horaHtml}
      <div class="card-top" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="cliente">${v.cliente||'Cliente'}</span><span class="tel">${v.telefono||''}</span></div>
      <div class="ruta">
        <div class="line"><div class="dot-o"></div><div><small style="color:#8E8E93;font-size:11px;font-weight:700">RECOGER <span class="dist-tag">${distCO? distCO.toFixed(1)+' km de ti' : 'calculando...'}</span></small><br><b>${v.origen}</b></div></div>
        <div class="line"><div class="dot-d"></div><div><small style="color:#8E8E93;font-size:11px;font-weight:700">DESTINO <span class="dist-tag2">${distOD? distOD.toFixed(1)+' km' : ''}</span></small><br><b>${v.destino}</b></div></div>
      </div>
      <div class="row-precio">
        <div class="precio-box">
          <div style="display:flex;justify-content:space-between"><small style="color:#8E8E93" class="precio-detalle">${distOD.toFixed(1)} km viaje</small></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><b class="precio-valor">$${precioFijo} MXN</b><span style="font-size:11px;color:#C5A880">Precio cliente</span></div>
        </div>
      </div>
      <div class="row-acciones">
        <button class="btn-tomar">Tomar viaje</button>
        <button class="btn-maps-icon btn-nav-pend" title="Navegación">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0A84FF" stroke="#0A84FF" stroke-width="2" stroke-linejoin="round"><path d="M3 11L22 2L13 21L11 13L3 11Z"/></svg>
        </button>
      </div>
    `;
    card.querySelector('.btn-nav-pend').onclick=()=>abrirNavegacion(v);
    card.querySelector('.btn-tomar').onclick=async()=>{
      if(viajesTomados.length>0) return alert("Ya tienes un viaje en curso. Finalízalo primero.");
      if(!conductorData) return alert("Cargando datos del conductor...");
      await updateDoc(doc(db,"servicios_prueba",v.id),{
        estado:"tomado", tomadoEn:new Date().toISOString(), conductorNombre:conductorData.nombre, conductorId: conductorData.uid,
        distanciaConductorOrigen:distCO, distanciaOrigenDestino:distOD, distanciaTotal:distOD, precioCobrado:precioFijo,
        tarifaKm:tarifa.por_km, tarifaUsada:tarifa, conductorLat:conductorCoords?.lat||null, conductorLng:conductorCoords?.lng||null, vistoPorAdmin:false
      });
    };
    lista.appendChild(card);
  }
}
</script>
</body>
</html>
