<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Conductores</title>
<style>
:root{--azul:#0A1931;--verde:#25D366;--naranja:#FF7A00}*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#F8FAFC;color:var(--azul)}
.header{background:var(--azul);color:#C5A880;padding:14px 16px;display:flex;gap:10px;font-weight:900;position:sticky;top:0;z-index:10}
.logo{width:32px;height:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:12px}
.badge{margin-left:auto;background:#E0F2FE;color:var(--azul);padding:5px 12px;border-radius:20px;font-size:12px}
.serv{background:#fff;border-radius:16px;padding:16px;margin:10px;box-shadow:0 2px 12px rgba(0,0,0,.07);border-left:5px solid var(--naranja)}
.btn-tomar{background:var(--verde);color:#fff;border:0;border-radius:12px;padding:14px;width:100%;font-weight:900;font-size:15px;margin-top:12px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-tomar:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="header"><div class="logo">CC</div> DRIVERS<span class="badge" id="count">0 activos</span></div>
<div id="lista">Conectando...</div>
<script type="module">
// ... tu config igual ...
import { getFirestore, collection, onSnapshot, query, where, doc, updateDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"};
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

// 1. UBICACIÓN DEL CONDUCTOR EN TIEMPO REAL
let driverPos = null;
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos => {
    driverPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    document.getElementById("count").innerText = `📍 GPS Activo`;
  }, err => { document.getElementById("count").innerText = `GPS apagado`; },
  { enableHighAccuracy: true });
}

// 2. FORMULA PARA KM (Haversine)
function kmDist(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
}

// 3. CONVERTIR DIRECCIÓN DEL CLIENTE A COORDENADAS
async function coordsDeDireccion(dir){
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=mx&q=${encodeURIComponent(dir)}`;
    const r = await fetch(url); const j = await r.json();
    if(j[0]) return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) };
  }catch(e){} return null;
}

const q = query(collection(db,"servicios_prueba"), where("estado","==","pendiente"));
onSnapshot(q, async (snap)=>{
  document.getElementById("count").innerText = snap.size + " activos" + (driverPos ? " - GPS OK" : "");
  let html="";
  if(snap.empty) html="<div style='text-align:center;margin-top:40px;color:#888'>No hay servicios</div>";
  
  for(const d of snap.docs){
    let s = d.data();
    let distTxt = "Calculando km...";
    if(driverPos){
      const destCoords = await coordsDeDireccion(s.origen);
      if(destCoords){
        const km = kmDist(driverPos.lat, driverPos.lon, destCoords.lat, destCoords.lon);
        distTxt = `📍 ${km} km de ti`;
      } else {
        distTxt = `📍 Distancia no disponible`;
      }
    } else {
      distTxt = `📍 Activa GPS para ver km`;
    }

    html+=`
    <div class="serv">
      <div style="display:flex;justify-content:space-between">
        <b>${s.cliente} - ${s.telefono}</b>
        <span style="background:#0A1931;color:#C5A880;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:800">${distTxt}</span>
      </div>
      <div style="margin:8px 0;line-height:1.3">${s.origen} → <b>${s.destino}</b></div>
      <button class="btn-tomar" onclick="tomarViaje('${d.id}')">🟢 TOMAR VIAJE - ${distTxt}</button>
    </div>`;
  }
  document.getElementById("lista").innerHTML=html;
});

window.tomarViaje=async(id)=>{
  const snapDoc = await getDoc(doc(db,"servicios_prueba",id));
  const data = snapDoc.data();
  const mensajeAuto = `CC-DRIVERS  Soy tu conductor asignado. Estoy en camino. Estoy a ${document.querySelector('.serv span')?.innerText || ''} de tu ubicación.`;
  await updateDoc(doc(db,"servicios_prueba",id), { estado:"aceptado", mensajeConductor: mensajeAuto, aceptadoEn: serverTimestamp(), conductorPos: driverPos });
  const tel = (data.telefono+"").replace(/\D/g,'');
  window.open(`https://wa.me/521${tel}?text=${encodeURIComponent(mensajeAuto + "\nOrigen: " + data.origen)}`,"_blank");
};
</script>
</body>
</html>
