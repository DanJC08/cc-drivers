<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CC Conductores</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--azul:#0A1931;--naranja:#FF7A00;--bg:#F5F5F7}
body{margin:0;background:var(--bg);display:flex;justify-content:center;min-height:100vh}
.iphone{width:100%;max-width:430px;background:var(--bg);min-height:100vh;position:relative;box-shadow:0 0 0 1px #e5e5e5, 0 20px 60px rgba(0,0,0,.15);overflow:hidden}
.header{background:var(--azul);color:#C5A880;padding:18px 20px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--azul);border:2px solid #C5A880;font-weight:900;font-size:14px}
.content{padding:16px 16px 100px}
.title{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:10px 4px 6px}
.sub{color:#8E8E93;font-size:14px;margin:0 4px 16px;font-weight:500}
.top-pill{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.06);font-weight:700;font-size:14px}
.live{display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;background:#34C759;border-radius:50%;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.badge{background:var(--naranja);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}
.cliente{font-weight:800;font-size:17px}
.tel{font-size:13px;color:#8E8E93;background:#F5F5F7;padding:4px 8px;border-radius:8px}
.hora-pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:20px;display:inline-block;margin-bottom:10px}
.prog{background:#FFF7D1;color:#7a5a00;border:1px solid #FFE58F}
.ahora{background:#E6FFF0;color:#0a7a2f;border:1px solid #b6f5c6}
.dist-tag{background:#0A1931;color:#C5A880;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;margin-left:6px}
.dist-tag2{background:#FF7A00;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;margin-left:6px}
.precio-box{background:#111;color:#fff;border-radius:14px;padding:12px 14px;margin-top:12px}
.precio-box b{font-size:22px;color:#C5A880}
.ruta{position:relative;padding-left:28px}
.ruta::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(to bottom, #D1D1D6 0 4px, transparent 4px 8px)}
.line{display:flex;gap:10px;margin:14px 0;align-items:flex-start}
.dot-o{width:16px;height:16px;background:var(--azul);border-radius:50%;border:3px solid #E5EFFF;flex-shrink:0;margin-top:2px}
.dot-d{width:16px;height:16px;background:var(--naranja);border-radius:50%;border:3px solid #FFEAD1;flex-shrink:0;margin-top:2px}
.btn-tomar{width:100%;padding:18px;background:#111;color:#fff;border:0;border-radius:14px;font-weight:800;font-size:17px;margin-top:16px}
.btn-tomar:active{transform:scale(.97)}
.vacio{text-align:center;padding:80px 20px;color:#8E8E93}
.tab-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.08);padding:12px 20px 30px;display:flex;justify-content:space-between}
.tab-bar a{color:var(--azul);text-decoration:none;font-size:13px;font-weight:600;opacity:.6}
</style>
</head>
<body>
<div class="iphone">
  <div class="header"><div style="display:flex;gap:10px;align-items:center"><div class="logo">CC</div> CONDUCTORES</div><div class="badge" id="contador">0</div></div>
  <div class="content">
    <div class="title">Viajes nuevos</div>
    <div class="sub" id="subInfo">Cargando tarifa...</div>
    <div class="top-pill"><div class="live"><div class="dot"></div> Escuchando</div><span id="status">Conectado</span></div>
    <div id="lista"><div class="vacio"><div>📡</div>Esperando viajes...</div></div>
  </div>
  <div class="tab-bar"><a href="#" id="logout">Cerrar sesión</a><a href="index.html">← Cliente</a></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc, limit, onSnapshot as onDocSnap } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {apiKey:"AIzaSyChsXZQJMSSU2iYm2WgbQUO_dnzNPzT3kI",authDomain:"cc-drivers.firebaseapp.com",projectId:"cc-drivers",storageBucket:"cc-drivers.firebasestorage.app",messagingSenderId:"1052687152920",appId:"1:1052687152920:web:3b0f29e77fc51f4162d06d"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const lista=document.getElementById('lista'), contador=document.getElementById('contador'), subInfo=document.getElementById('subInfo');

// TARIFA DINÁMICA DESDE FIREBASE
let tarifa = {base:25, por_km:12, por_min:1.5, minimo:50, factor_demanda:1.0, extra_nocturno:15, extra_lluvia:0};

async function cargarTarifa(){
  try{
    // Escucha en tiempo real para que si tú cambias el precio, a todos los choferes les cambia solo
    onDocSnap(doc(db,"config","tarifas"), (snap)=>{
      if(snap.exists()){
        const d = snap.data();
        tarifa.base = Number(d.base) || 25;
        tarifa.por_km = Number(d.por_km) || 12;
        tarifa.por_min = Number(d.por_min) || 1.5;
        tarifa.minimo = Number(d.minimo) || 50;
        tarifa.factor_demanda = Number(d.factor_demanda) || 1.0;
        tarifa.extra_nocturno = Number(d.extra_nocturno) || 0;
        tarifa.extra_lluvia = Number(d.extra_lluvia) || 0;
        if(conductorData) actualizarSubInfo();
        if(viajesCache.length>0) render();
      }
    });
  }catch(e){ console.log("Tarifa por defecto", e); }
}
cargarTarifa();

function actualizarSubInfo(){
  let txt = `👋 ${conductorData?.nombre||''} • Base $${tarifa.base} + $${tarifa.por_km}/km`;
  if(tarifa.factor_demanda > 1) txt += ` • 🔥 x${tarifa.factor_demanda}`;
  if(conductorCoords) txt += ` • GPS ✅`;
  subInfo.textContent = txt;
}

function calcularPrecioFinal(distKm){
  const ahora = new Date();
  const hora = ahora.getHours();
  const duracionMin = (distKm / 30) * 60; // 30km/h promedio Uruapan
  
  let precio = tarifa.base + (distKm * tarifa.por_km) + (duracionMin * tarifa.por_min);
  
  let detalle = [];
  if(tarifa.factor_demanda > 1){
    detalle.push(`Demanda x${tarifa.factor_demanda}`);
    precio = precio * tarifa.factor_demanda;
  }
  if((hora >= 22 || hora < 6) && tarifa.extra_nocturno>0){
    detalle.push(`Nocturno +$${tarifa.extra_nocturno}`);
    precio += tarifa.extra_nocturno;
  }
  if(tarifa.extra_lluvia>0){
    detalle.push(`Lluvia +$${tarifa.extra_lluvia}`);
    precio += tarifa.extra_lluvia;
  }

  precio = Math.max(precio, tarifa.minimo);
  precio = Math.round(precio/5)*5; // redondeo a $5

  return {precio, minutos: Math.round(duracionMin), detalle};
}

let conductorCoords = null;
let conductorData = null;
let viajesCache = [];
let prevCount = -1;
const audio = new Audio('https://cdn.pixabay.com/audio/2022/03/24/audio_b9bd4170e8.mp3');
audio.preload = 'auto';
let audioListo = false;

function desbloquearAudio(){
  if(audioListo) return;
  audio.play().then(()=>{ audio.pause(); audio.currentTime = 0; audioListo = true; }).catch(()=>{});
}
document.addEventListener('click', desbloquearAudio, {once:true});
document.addEventListener('touchstart', desbloquearAudio, {once:true});
function sonar(){
  desbloquearAudio();
  audio.currentTime = 0; audio.play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([400,100,400,100,400]);
  let orig=document.title; document.title="🔥 ¡NUEVO VIAJE! 🔥"; setTimeout(()=>document.title=orig,2000);
}

document.getElementById('logout').onclick=async()=>{ await signOut(auth); location.href="login-conductores.html"; }

onAuthStateChanged(auth, async (user)=>{
  if(!user){ window.location.href="login-conductores.html"; return; }
  try{
    const snap=await getDoc(doc(db,"conductores",user.uid));
    if(!snap.exists() || snap.data().estado!=="aprobado"){
      await signOut(auth); window.location.href="login-conductores.html"; return;
    }
    conductorData = {uid:user.uid,...snap.data()};
    actualizarSubInfo();
  }catch(e){ subInfo.textContent = "Error perfil: "+e.message; }
});

function calcKm(a,b){
  const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

navigator.geolocation.watchPosition(pos=>{
  conductorCoords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
  actualizarSubInfo();
}, ()=>{}, {enableHighAccuracy:true, maximumAge:30000, timeout:10000});

const q=query(collection(db,"servicios_prueba"),where("estado","in",["pendiente","programado"]),limit(20));
onSnapshot(q, (snap)=>{
  const nuevos=[]; snap.forEach(d=>nuevos.push({id:d.id,...d.data()}));
  nuevos.sort((a,b)=>{ if(a.estado==='pendiente'&&b.estado==='programado')return -1; if(a.estado==='programado'&&b.estado==='pendiente')return 1; return 0; });
  if(prevCount!==-1 && nuevos.length>prevCount) sonar();
  prevCount=nuevos.length; viajesCache=nuevos; render();
});

async function render(){
  if(viajesCache.length===0){lista.innerHTML='<div class="vacio"><div>☕️</div>Sin viajes</div>';contador.textContent='0';return;}
  contador.textContent=viajesCache.length;
  lista.innerHTML='';
  for(let v of viajesCache){
    const distOD = v.distanciaOrigenDestino || v.distanciaTotal || 0;
    // Usa el precio que YA calculó el cliente y guardó en el pedido
    let precioFinal = v.precioEstimado || v.precio;
    let minutos = v.tiempoMin || 0;
    let detalleTxt = "";

    if(!precioFinal){
      // Si es un pedido viejo sin precio, lo calculamos aquí con tarifa dinámica
      const calc = calcularPrecioFinal(distOD || 2);
      precioFinal = calc.precio;
      minutos = calc.minutos;
      detalleTxt = calc.detalle.join(" • ");
    } else {
      detalleTxt = `Base $${tarifa.base} + ${distOD.toFixed(1)}km x $${tarifa.por_km}`;
      if(tarifa.factor_demanda>1) detalleTxt+=` • x${tarifa.factor_demanda}`;
    }

    const horaHtml = v.fechaHoraProgramada? `<div class="hora-pill prog">⏰ ${new Date(v.fechaHoraProgramada).toLocaleString('es-MX',{dateStyle:'short', timeStyle:'short'})}</div>` : `<div class="hora-pill ahora">🔥 AHORA • ${minutos} min</div>`;

    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      ${horaHtml}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="cliente">${v.cliente||'Cliente'}</span><span class="tel">${v.telefono||''}</span></div>
      <div class="ruta">
        <div class="line"><div class="dot-o"></div><div><small style="color:#8E8E93;font-size:11px;font-weight:700">RECOGER</small><br><b>${v.origen}</b></div></div>
        <div class="line"><div class="dot-d"></div><div><small style="color:#8E8E93;font-size:11px;font-weight:700">DESTINO <span class="dist-tag2">${distOD? distOD.toFixed(1)+' km' : ''}</span></small><br><b>${v.destino}</b></div></div>
      </div>
      <div class="precio-box">
        <small style="color:#8E8E93">${detalleTxt}</small>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
          <b>$${precioFinal} MXN</b>
          <span style="font-size:11px;color:#C5A880">${v.precioEstimado? 'Precio cliente' : 'Estimado dinámica'}</span>
        </div>
        ${minutos? `<small style="color:#666">⏱️ ${minutos} min aprox • Mínimo $${tarifa.minimo}</small>` : ``}
      </div>
      <button class="btn-tomar">Tomar por $${precioFinal}</button>
    `;
    card.querySelector('.btn-tomar').onclick=async()=>{
      if(!conductorData) return alert("Cargando datos...");
      await updateDoc(doc(db,"servicios_prueba",v.id),{
        estado:"tomado", tomadoEn:new Date().toISOString(),
        conductorNombre:conductorData.nombre, conductorId: conductorData.uid,
        precioCobrado:precioFinal, tarifaUsada: tarifa
      });
      const telLimpio=(v.telefono||'').replace(/[^0-9]/g,'');
      if(telLimpio){
        const msg = `Hola ${v.cliente||''} 👋 Soy ${conductorData.nombre} de CC DRIVERS 🚗\nTu viaje: ${v.origen} → ${v.destino}\n💰 $${precioFinal} MXN • ⏱️ ${minutos} min\nEstoy en camino.`;
        window.open(`https://wa.me/52${telLimpio}?text=${encodeURIComponent(msg)}`,'_blank');
      }
    };
    lista.appendChild(card);
  }
}
</script>
</body>
</html>
